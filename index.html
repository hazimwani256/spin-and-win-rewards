<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin & Win Rewards</title>
<style>
:root{--bg:#100d24;--panel:#1d1838;--text:#fff;--muted:#c6c0e3;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#30205b,var(--bg) 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px 14px 40px}.brand{text-align:center;margin:8px 0 16px}.brand h1{margin:4px 0 2px;font-size:28px}.brand p{margin:0;color:var(--muted);font-size:13px}
.panel{background:rgba(29,24,56,.94);border:1px solid #413767;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 12px 35px rgba(0,0,0,0.3)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:#100d24;border:1px solid #514878;border-radius:12px;padding:12px;color:white;font-size:15px;outline:none}
input:focus{border-color:var(--gold)}
.wheel-wrap{position:relative;width:min(80vw,300px);margin:10px auto 16px;aspect-ratio:1}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #f9d66b;box-shadow:0 0 0 5px #49366e,0 12px 30px rgba(0,0,0,0.5);transition:transform 4s cubic-bezier(.12,.72,.08,1);background:conic-gradient
